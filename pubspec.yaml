name: photo_editor
description: Simple photo editor

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  bitmap: ^0.3.0
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0
  gal: ^2.3.1
  
  # SDK extensions
  async: ^2.8.2
  collection: ^1.15.0
  meta: ^1.7.0

  # System
  path_provider: ^2.0.0
  path: ^1.8.0
  platform_info: ^3.1.0

  # Data manipulation
  pure: ^0.2.0
  fast_immutable_collections: ^7.0.0
  stream_transform: ^2.0.0

  # BLoC
  stream_bloc: ^0.5.1

  # Flutter integrations
  flutter_bloc: ^8.0.1
  provider: ^6.0.2

  # Code generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.4.0

  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter 

  # Logging
  l: ^3.1.0
  sentry_flutter: ^8.14.0
  stack_trace: ^1.10.0

  # Persistance
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  shared_preferences: ^2.0.13

  # HTTP
  dio: ^4.0.4
  retrofit: ^3.0.1

  # Navigation
  auto_route: ^5.0.4

dev_dependencies:
  build_runner: 2.15.0
  drift_dev: ^2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.9.0

dependency_overrides:
  meta: ^1.18.3
  win32: ^5.10.1


flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "asset/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "asset/logo.png"

flutter_gen:
  output: lib/src/core/resources
  
flutter:
  uses-material-design: true
  generate: true
  assets:
    - asset/
    - asset/image/
  fonts:
    - family: Inter
      fonts:
          - asset: asset/font/inter/Inter-ExtraLight.ttf
            weight: 200
          - asset: asset/font/inter/Inter-Light.ttf
            weight: 300
          - asset: asset/font/inter/Inter-Regular.ttf
            weight: 400
          - asset: asset/font/inter/Inter-Medium.ttf
            weight: 500
          - asset: asset/font/inter/Inter-SemiBold.ttf
            weight: 600
          - asset: asset/font/inter/Inter-Bold.ttf
            weight: 700
          - asset: asset/font/inter/Inter-ExtraBold.ttf
            weight: 800

